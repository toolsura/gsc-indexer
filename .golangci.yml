version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  default: none
  enable:
    - bodyclose
    - copyloopvar
    - dogsled
    - dupl
    - errcheck
    - exhaustive
    - gochecknoinits
    - goconst
    - goprintffuncname
    - govet
    - ineffassign
    - misspell
    - nilerr
    - nilnil
    - noctx
    - nolintlint
    - prealloc
    - predeclared
    - revive
    - staticcheck
    - thelper
    - unconvert
    - unused
    - usetesting
    - whitespace
  settings:
    goconst:
      min-len: 3
      min-occurrences: 3
    revive:
      rules:
        - name: exported
          severity: warning
          disabled: false
    staticcheck:
      checks: ["all", "-ST1000", "-ST1003"]
    unused:
      check-exported: false
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - dupl
          - gochecknoinits
          - goconst

# v2 moved gofmt/goimports from linters to formatters
formatters:
  enable:
    - gofmt
    - goimports

output:
  formats:
    colored-line-number:
      path: stdout
  print-issued-lines: true
  print-linter-name: true