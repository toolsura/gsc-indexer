name: Bug Report
description: Report a bug or unexpected behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill out the sections below.
  - type: input
    id: version
    attributes:
      label: gsc-indexer version
      description: Run `gsc-indexer -version` or `go version -m $(which gsc-indexer)`
      placeholder: "v0.1.0 or commit hash"
    validations:
      required: true
  - type: input
    id: go-version
    attributes:
      label: Go version
      description: Run `go version`
      placeholder: "go1.24.0 linux/amd64"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating System
      placeholder: "Ubuntu 24.04, macOS 14, Windows 11"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: Clear and concise description of the bug
      placeholder: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Minimal steps to reproduce the issue
      placeholder: |
        1. Run `gsc-indexer -creds sa.json "https://example.com/sitemap.xml"`
        2. Observe error...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened?
      placeholder: The tool should...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs / Output
      description: Paste any error messages, stack traces, or command output
      render: shell
      placeholder: |
        $ gsc-indexer -creds sa.json "https://example.com/sitemap.xml"
        error: ...
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues for duplicates
          required: true
        - label: I can reproduce this with the latest main branch
          required: true
        - label: This is not a configuration/credential issue
          required: true