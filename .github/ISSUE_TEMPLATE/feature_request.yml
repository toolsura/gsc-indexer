name: Feature Request
description: Suggest a new feature or enhancement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Please describe your idea below.
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this solve? What's the use case?
      placeholder: Currently it's difficult to...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How should this work? CLI flag, new command, config option?
      placeholder: Add a `-format` flag to output...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any other approaches you've thought of?
      placeholder: Could also be done via...
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Links, screenshots, related issues, etc.
      placeholder: Related to #123...
    validations:
      required: false
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues for duplicates
          required: true
        - label: This aligns with the project's scope (GSC URL Inspection API)
          required: true